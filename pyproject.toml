[project]
name = "iphone-mirror-mcp"
version = "0.1.0"
description = "MCP server that lets Claude control an iPhone via the macOS iPhone Mirroring app"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ishan-crd", email = "ishangupta3121@gmail.com" }
]
keywords = ["mcp", "iphone", "macos", "automation", "claude"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pillow>=10.0",
    "pyobjc-framework-applicationservices>=10.0",
    "pyobjc-framework-cocoa>=10.0",
    "pyobjc-framework-quartz>=10.0",
]

[project.scripts]
iphone-mirror-mcp = "iphone_mirror_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
